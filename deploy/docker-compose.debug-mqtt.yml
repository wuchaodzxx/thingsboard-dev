# =====================================================================
# 调试用覆盖编排：对外暴露 MQTT 明文端口 18884（容器内 1883）
# 仅在本地调试、无法使用 TLS 的临时排障场景使用，日常不得开启。
# 用法（在 deploy/ 目录执行）：
#   docker compose -f docker-compose.yml -f docker-compose.debug-mqtt.yml up -d
# =====================================================================

services:
  thingsboard:
    ports:
      - "${MQTT_DEBUG_PORT:-18886}:1883"
